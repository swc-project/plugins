name: Contributor policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: contributor-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enforce:
    if: github.repository == 'swc-project/plugins'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Use the policy action and contributor list from the main SWC repository.
      # Never check out the PR head, merge ref, or a contributor-selected branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swc-project/swc
          ref: main
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/contributors.yml
            /.github/actions/contributor-policy/

      - uses: ./.github/actions/contributor-policy
        with:
          token: ${{ github.token }}
          close-untrusted: "true"
