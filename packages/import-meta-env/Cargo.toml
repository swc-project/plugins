[package]
authors      = ["Alex Miller <codex.nz@gmail.com>"]
description  = "SWC plugin to transform import.meta.env to process.env"
edition      = { workspace = true }
homepage     = { workspace = true }
license      = { workspace = true }
name         = "swc_plugin_import_meta_env"
publish      = false
repository   = { workspace = true }
rust-version = { workspace = true }
version      = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
swc_common     = { workspace = true, features = ["concurrent"] }
swc_core       = { workspace = true, features = ["ecma_plugin_transform"] }
swc_ecma_ast   = { workspace = true }
swc_ecma_visit = { workspace = true }
tracing        = { workspace = true, features = ["release_max_level_off"] }

[dev-dependencies]
swc_ecma_transforms_testing = { workspace = true }
